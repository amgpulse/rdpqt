name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build one .deb package
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-deb:
    name: "📦 .deb"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v4

      - name: "📥 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev \
            dpkg-dev

      - name: "🔧 CMake configure"
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -G Ninja

      - name: "🔨 Build"
        run: cmake --build build --parallel

      - name: "📦 CPack → .deb"
        run: |
          cd build
          cpack -G DEB
          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          ls -lh *.deb

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Build one .rpm package (Fedora container)
# ─────────────────────────────────────────────────────────────────────────────
  build-rpm:
    name: "📦 .rpm"
    runs-on: ubuntu-22.04
    container:
      image: fedora:44

    steps:
      - name: "📥 Install git & tools (Fedora needs them)"
        run: |
          dnf install -y \
            git gcc-c++ cmake ninja-build \
            qt6-qtbase-devel \
            rpm-build rpmdevtools

      - name: "⬇️ Checkout"
        uses: actions/checkout@v4

      - name: "🔧 CMake configure"
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -G Ninja

      - name: "🔨 Build"
        run: cmake --build build --parallel

      - name: "📦 CPack → .rpm"
        run: |
          cd build
          cpack -G RPM
          test "$(find . -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 1
          ls -lh *.rpm

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/*.rpm

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: Build .AppImage (Universal Linux x86_64)
# ─────────────────────────────────────────────────────────────────────────────
  build-appimage:
    name: "📦 .AppImage (Universal Linux x86_64)"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v4

      - name: "📥 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev \
            libglib2.0-0 libdbus-1-3 \
            libfuse2 wget file patchelf \
            desktop-file-utils

      - name: "📥 Download linuxdeploy tools"
        run: |
          # Download and extract linuxdeploy (avoids FUSE issues in CI)
          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-extracted

          # Download and extract linuxdeploy Qt plugin
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt.AppImage
          ./linuxdeploy-plugin-qt.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-qt-extracted

          # Download appimagetool separately for final packaging
          wget -q -O appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          mv squashfs-root appimagetool-extracted

          # Wire up Qt plugin so linuxdeploy can find it
          cp linuxdeploy-qt-extracted/usr/bin/linuxdeploy-plugin-qt \
             linuxdeploy-extracted/usr/bin/linuxdeploy-plugin-qt
          chmod +x linuxdeploy-extracted/usr/bin/linuxdeploy-plugin-qt

      - name: "🔧 CMake configure & Build"
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -G Ninja
          cmake --build build --parallel

      - name: "📂 Install into AppDir"
        run: |
          DESTDIR="$(pwd)/AppDir" cmake --install build
          # Ensure icon is at AppDir root (AppImage spec)
          cp packaging/rdpqt.png AppDir/rdpqt.png
          # Verify structure
          find AppDir -type f | sort

      - name: "📦 Bundle Qt libraries with linuxdeploy"
        env:
          QMAKE: /usr/bin/qmake6
          DEPLOY_PLATFORM_THEMES: "1"
          EXTRA_PLATFORM_PLUGINS: "libqxcb.so"
        run: |
          linuxdeploy-extracted/AppRun \
            --appdir AppDir \
            --plugin qt \
            --desktop-file packaging/rdpqt.desktop \
            --icon-file packaging/rdpqt.png \
            --verbosity 1

      - name: "📦 Create final .AppImage"
        env:
          ARCH: x86_64
        run: |
          appimagetool-extracted/AppRun \
            --no-appstream \
            AppDir \
            "rdpqt-x86_64.AppImage"
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          ls -lh *.AppImage

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "*.AppImage"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Create GitHub Release (tags only)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "🚀 GitHub Release"
    runs-on: ubuntu-22.04
    needs: [ build-deb, build-rpm, build-appimage ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: "⬇️ Checkout (with full history for changelog)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⬇️ Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: false

      - name: "📋 List files to be released"
        run: find dist/ -type f | sort

      - name: "📝 Build release notes"
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## What's Changed in ${TAG}"
            echo ""
            git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" \
              "${PREV}..HEAD"
            echo ""
            echo ""
            echo "---"
            echo "### 📥 Download"
            echo "| Package | Build target |"
            echo "|---------|--------------|"
            echo "| \`.deb\` | Ubuntu 22.04 |"
            echo "| \`.rpm\` | Fedora 44 |"
            echo "| \`.AppImage\` | Any Linux x86_64 |"
          } > release_notes.md
          cat release_notes.md

      - name: "🚀 Publish Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "rdpqt ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
